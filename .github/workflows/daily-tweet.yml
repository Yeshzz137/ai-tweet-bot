name: Daily AI Tweet Bot

on:
  schedule:
    - cron: '00 2 * * *'   # ~7:30 AM IST
    - cron: '30 3 * * *'   # ~9:00 AM IST
    - cron: '30 12 * * *'  # ~6:00 PM IST
    - cron: '00 15 * * *'  # ~8:30 PM IST
  workflow_dispatch:       # Manual trigger button

permissions:
  contents: write  # This allows the bot to save posted_urls.txt
  
jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tweet bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          # Customize here (change anytime by editing file)
          GENRE: "All Genres"
          NUM_TWEETS: "1"
          CUSTOM_PROMPT: "Focus on real-world applications and impact"
        run: python app.py

      # Save posted_urls.txt back (keeps deduplication across runs)
      - name: Commit posted_urls.txt if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add posted_urls.txt || true
          git commit -m "Update posted_urls.txt after run $(date)" || echo "No changes"
          git push || echo "Push failed (no changes)"
